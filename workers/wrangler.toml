# ZenMatch Games — Cloudflare Worker API
# Leaderboard and game data backend

name = "chinagames"
main = "src/index.js"
compatibility_date = "2026-07-01"

# D1 Database for scores
[[d1_databases]]
binding = "DB"
database_name = "dragontile-db"
database_id = "bb0309a7-a31d-4e3d-9902-935c9e060703"

# KV namespace for config/sessions
[[kv_namespaces]]
binding = "KV"
id = "f59a716623314b4ea9f3900039929d0b"

[vars]
ALLOWED_ORIGINS = "https://zenmatchgames.com,https://www.zenmatchgames.com"
